<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>English Tracker — Patrick</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #0e1015;
    --card: #171a22;
    --card2: #1d212c;
    --line: #262b38;
    --text: #e8eaf0;
    --sub: #8b93a7;
    --dim: #4c556c;
    --accent: #ff5c5c;
    --gold: #f5b942;
    --green: #3ecf8e;
    --blue: #5aa9ff;
    --purple: #c792ea;
    --radius: 20px;
    --nav-h: 62px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + var(--nav-h) + 28px);
  }

  /* ───── header ───── */
  header { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 16px; }
  .h-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
  .h-title span { color: var(--accent); }
  .h-date { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .streak-chip {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, #2a1c12, #1d1610);
    border: 1px solid #43301c;
    border-radius: 999px; padding: 8px 14px;
    font-weight: 800; font-size: 15px; color: var(--gold);
  }
  .streak-chip small { font-weight: 600; font-size: 11px; color: #a98d5f; }

  /* ───── quote — 매일 바뀌는 한 줄 ───── */
  .quote-line {
    margin: 20px 0 2px; padding: 11px 14px 11px 15px;
    border-left: 2px solid var(--accent);
    background: linear-gradient(90deg, rgba(255,92,92,.07), transparent 70%);
    border-radius: 0 12px 12px 0;
    font-size: 13.5px; font-weight: 600; font-style: italic;
    color: #c6ccdb; line-height: 1.5;
  }

  /* ───── section ───── */
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 2px 12px; }
  .sec-title { font-size: 15.5px; font-weight: 800; letter-spacing: -0.3px; }
  .sec-title small { font-size: 11px; color: var(--sub); font-weight: 600; margin-left: 5px; }
  .sec-sub { font-size: 12px; color: var(--sub); flex-shrink: 0; }
  .sec-sub button {
    background: none; border: none; color: var(--blue); font: inherit; font-size: 12px;
    font-weight: 700; cursor: pointer; padding: 0;
  }

  /* ───── progress ───── */
  .day-progress { display: flex; align-items: center; gap: 10px; }
  .day-progress .bar { flex: 1; height: 6px; background: #232838; border-radius: 99px; overflow: hidden; }
  .day-progress .fill { height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #ff5c5c, #f5b942); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .day-progress .num { font-size: 13px; font-weight: 800; color: var(--gold); min-width: 30px; text-align: right; }

  /* ───── habit strip (컴팩트) ───── */
  .routines { display: flex; gap: 7px; margin-top: 12px; }
  .r-item {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .r-dot {
    position: relative; width: 100%; aspect-ratio: 1;
    border-radius: 17px; background: var(--card); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 21px;
    transition: transform .12s ease, background .25s, border-color .25s;
  }
  .r-item:active .r-dot { transform: scale(0.92); }
  .r-item[data-k="podcast"]  .r-dot { background: linear-gradient(135deg,#3b2a17,#2a1d10); }
  .r-item[data-k="words"]    .r-dot { background: linear-gradient(135deg,#17303b,#102028); }
  .r-item[data-k="office"]   .r-dot { background: linear-gradient(135deg,#1a2a3f,#131d2c); }
  .r-item[data-k="review"]   .r-dot { background: linear-gradient(135deg,#1b3327,#12231b); }
  .r-item[data-k="speaking"] .r-dot { background: linear-gradient(135deg,#2c1e3d,#1e1529); }
  .r-lb { font-size: 10px; font-weight: 700; color: var(--sub); text-align: center; line-height: 1.25; }
  .r-item.done .r-dot { border-color: rgba(62,207,142,.5); filter: grayscale(.5); opacity: .62; }
  .r-item.done .r-dot::after {
    content: "✓"; position: absolute; top: -4px; right: -4px;
    width: 19px; height: 19px; border-radius: 999px;
    background: var(--green); color: #08130d;
    font-size: 11px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg); filter: none;
  }
  .r-item.done .r-lb { color: var(--green); }

  /* ───── all-done banner ───── */
  .allDone {
    display: none;
    margin-top: 12px; text-align: center;
    background: linear-gradient(135deg, rgba(62,207,142,.12), rgba(245,185,66,.10));
    border: 1px solid rgba(62,207,142,.3);
    border-radius: 16px; padding: 14px;
    font-weight: 800; font-size: 14.5px; color: var(--green);
  }
  .allDone.show { display: block; animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0% { transform: scale(.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* ───── calendar (컴팩트) ───── */
  .cal-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 11px 11px 10px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; padding: 0 2px; }
  .cal-nav b { font-size: 13.5px; font-weight: 800; }
  .cal-nav button {
    background: none; border: none; color: var(--sub);
    width: 28px; height: 26px; border-radius: 8px; font-size: 16px; cursor: pointer;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow { text-align: center; font-size: 9.5px; color: var(--dim); padding: 2px 0 4px; font-weight: 700; }
  .cal-cell { position: relative; height: 31px; display: flex; align-items: center; justify-content: center; }
  .cal-cell .d { font-size: 12px; color: #98a0b4; font-weight: 600; z-index: 1; }
  .cal-cell.other .d { color: #333a49; }
  .cal-cell.today .d { color: #fff; font-weight: 900; }
  .cal-cell.today::after {
    content: ""; position: absolute; width: 25px; height: 25px;
    border-radius: 999px; background: rgba(255,255,255,0.07);
  }
  .cal-cell svg { position: absolute; width: 27px; height: 27px; z-index: 2; pointer-events: none; }
  .cal-stats { display: flex; gap: 6px; margin-top: 9px; }
  .cal-stat { flex: 1; background: var(--card2); border-radius: 10px; padding: 7px 4px; text-align: center; }
  .cal-stat b { display: block; font-size: 15px; font-weight: 800; }
  .cal-stat span { font-size: 9.5px; color: var(--sub); }

  /* ───── expression card (공통 규격) ───── */
  .fc {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 15px; margin-bottom: 10px; cursor: pointer;
    transition: opacity .3s, transform .3s, border-color .2s;
  }
  .fc.open { border-color: #333a4d; }
  .fc .fc-top { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; font-weight: 800; letter-spacing: .2px;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .badge.wanted    { color: var(--accent); background: rgba(255,92,92,.12); }
  .badge.delivered { color: var(--blue);   background: rgba(90,169,255,.12); }
  .badge.manual    { color: var(--gold);   background: rgba(245,185,66,.12); }
  .badge.slot      { color: var(--sub);    background: #232838; }
  .badge.date      { color: var(--dim);    background: transparent; padding-left: 0; margin-left: auto; }
  .fc .expr-row { display: flex; align-items: flex-start; gap: 10px; }
  .fc .expr { flex: 1; font-size: 16px; font-weight: 800; line-height: 1.4; letter-spacing: -0.2px; }
  .fc .expr.ko { color: #ffd98a; font-size: 17px; }
  .fc .expr.ko.tagmode { color: #c9b6e8; font-size: 14.5px; line-height: 1.5; font-weight: 700; }
  .prompt-l {
    font-size: 10.5px; font-weight: 800; color: var(--dim);
    letter-spacing: .5px; margin-bottom: 6px; text-transform: uppercase;
  }
  .hintrow { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
  .hint-btn {
    background: var(--card2); border: 1px solid var(--line); color: var(--sub);
    border-radius: 999px; padding: 5px 12px; font-size: 11.5px; font-weight: 800;
    cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  .hintrow { flex-wrap: wrap; }
  .hint-txt { font-size: 13px; color: #c3c9d9; font-weight: 700; line-height: 1.5; }
  .hint-txt em {
    font-style: normal; font-size: 10px; font-weight: 800; color: var(--dim);
    background: var(--card2); border-radius: 5px; padding: 2px 6px; margin-right: 6px;
    vertical-align: 1px;
  }
  .prompt-l .wc {
    float: right; text-transform: none; letter-spacing: 0;
    color: var(--sub); font-weight: 700;
  }
  u.key {
    text-decoration: underline; text-decoration-color: var(--gold);
    text-decoration-thickness: 2px; text-underline-offset: 4px;
  }
  .blk-answer { margin-bottom: 13px; }
  .blk-answer .expr { color: #fff; }

  /* 방향 토글 */
  .dirseg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .dirseg button {
    background: none; border: none; color: var(--sub); font-family: inherit;
    font-size: 11.5px; font-weight: 800; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .dirseg button.on { background: rgba(255,92,92,.16); color: var(--accent); }
  .spk {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px;
    background: var(--card2); border: 1px solid var(--line); color: var(--sub);
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s; font-family: inherit;
  }
  .spk:active, .spk.on { background: rgba(90,169,255,.16); border-color: rgba(90,169,255,.4); color: var(--blue); }
  .spk.sm { width: 26px; height: 26px; font-size: 12px; border-radius: 8px; }
  .fc .tap-hint { font-size: 11px; color: var(--dim); margin-top: 10px; }
  .fc.open .tap-hint { display: none; }
  .fc .back { display: none; margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--line); }
  .fc.open .back { display: block; }

  /* 카드 뒷면 — 항상 같은 순서의 라벨 블록 */
  .blk { margin-bottom: 13px; }
  .blk:last-child { margin-bottom: 0; }
  .blk-l {
    font-size: 10.5px; font-weight: 800; color: var(--dim);
    letter-spacing: .5px; margin-bottom: 5px; text-transform: uppercase;
  }
  .blk-mean { font-size: 14.5px; color: #dbe0ec; line-height: 1.5; font-weight: 600; }
  .blk-ex {
    font-size: 13.5px; color: #c3c9d9; line-height: 1.7;
    display: flex; align-items: flex-start; gap: 9px;
  }
  .blk-ex > span { flex: 1; }
  .blk-ex b.st { color: #fff; font-weight: 800; background: rgba(245,185,66,.15); border-radius: 4px; padding: 0 3px; }
  .blk-ex i.ar { font-style: normal; color: var(--purple); font-weight: 800; padding: 0 1px; }
  .blk-ex i.br { font-style: normal; color: #394054; font-weight: 700; padding: 0 4px; }
  .legend { font-size: 10.5px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 6px 10px; border-radius: 9px;
    background: var(--card2); border: 1px solid var(--line); color: #b6bdcd;
    line-height: 1.3; cursor: pointer;
  }
  .chip.tag { color: var(--sub); background: transparent; font-size: 11.5px; padding: 4px 9px; }
  .chip:active { border-color: rgba(90,169,255,.4); }
  .prog-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stage-dots { display: flex; gap: 3px; }
  .stage-dots i { width: 15px; height: 4px; border-radius: 2px; background: #2a3040; }
  .stage-dots i.on { background: var(--green); }
  .prog-next { font-size: 11px; color: var(--dim); }
  .fc-btns { display: flex; gap: 7px; margin-top: 14px; }
  .fc-btns button {
    flex: 1; padding: 12px 4px; border-radius: 12px;
    font-size: 12.5px; font-weight: 800; cursor: pointer; font-family: inherit;
    border: 1px solid transparent; line-height: 1.3;
  }
  .fc-btns button small { display: block; font-size: 9.5px; font-weight: 600; opacity: .75; margin-top: 2px; }
  .btn-again { background: rgba(255,92,92,.12);  color: var(--accent); border-color: rgba(255,92,92,.3); }
  .btn-hard  { background: rgba(245,185,66,.12); color: var(--gold);   border-color: rgba(245,185,66,.3); }
  .btn-good  { background: rgba(62,207,142,.14); color: var(--green);  border-color: rgba(62,207,142,.35); }
  .btn-study {
    width: 100%; margin-top: 14px; padding: 13px; border-radius: 12px;
    background: rgba(62,207,142,.14); color: var(--green);
    border: 1px solid rgba(62,207,142,.35);
    font-size: 13.5px; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  .btn-reopen {
    width: 100%; margin-top: 12px; padding: 11px; border-radius: 12px;
    background: var(--card2); color: var(--sub); border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }

  .empty {
    text-align: center; color: var(--sub); font-size: 13px;
    background: var(--card); border: 1px dashed var(--line);
    border-radius: 16px; padding: 22px 16px; line-height: 1.6;
  }
  .empty b { color: #c3c9d9; }
  .date-sep {
    font-size: 11.5px; font-weight: 800; color: var(--dim);
    margin: 16px 2px 8px; letter-spacing: .3px;
  }
  .date-sep:first-child { margin-top: 0; }

  /* ───── stage distribution ───── */
  .dist { display: flex; flex-direction: column; gap: 8px; }
  .dist-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .dist-row .lb { width: 66px; color: var(--sub); flex-shrink: 0; font-weight: 600; }
  .dist-row .tr { flex: 1; height: 8px; background: #232838; border-radius: 99px; overflow: hidden; }
  .dist-row .bf { height: 100%; border-radius: 99px; background: linear-gradient(90deg,#3ecf8e,#5aa9ff); }
  .dist-row .vn { width: 26px; text-align: right; color: #b6bdcd; font-weight: 800; flex-shrink: 0; }

  /* ───── game ───── */
  .g-hero {
    background: linear-gradient(160deg, #241a33 0%, #171a22 100%);
    border: 1px solid #35284a; border-radius: var(--radius);
    padding: 26px 20px; text-align: center; margin-top: 6px;
  }
  .g-hero h2 { font-size: 21px; font-weight: 800; letter-spacing: -0.4px; }
  .g-hero p { font-size: 13px; color: var(--sub); line-height: 1.65; margin-top: 10px; }
  .g-hero .best { font-size: 12px; color: var(--gold); font-weight: 800; margin-top: 12px; }
  .g-go {
    width: 100%; margin-top: 18px; padding: 15px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #ff5c5c, #c792ea); color: #fff;
    font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  .g-go:disabled { background: var(--card2); color: var(--dim); cursor: default; }
  .g-weak { margin-top: 18px; }
  .g-weak .row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 7px;
  }
  .g-weak .row .e { flex: 1; font-size: 13px; font-weight: 700; line-height: 1.4; }
  .g-weak .row .x { font-size: 11px; font-weight: 800; color: var(--accent); flex-shrink: 0; }

  .g-bar { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; }
  .g-bar .tr { flex: 1; height: 6px; background: #232838; border-radius: 99px; overflow: hidden; }
  .g-bar .bf { height: 100%; border-radius: 99px; background: linear-gradient(90deg,#c792ea,#ff5c5c); transition: width .3s; }
  .g-bar .n { font-size: 12px; font-weight: 800; color: var(--sub); }
  .g-bar .combo { font-size: 12px; font-weight: 800; color: var(--gold); }

  .g-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 16px; }
  .g-kind { font-size: 10.5px; font-weight: 800; color: var(--dim); letter-spacing: .5px; text-transform: uppercase; }
  .g-prompt { font-size: 19px; font-weight: 800; line-height: 1.45; margin-top: 9px; letter-spacing: -0.3px; }
  .g-prompt.ko { color: #ffd98a; }
  .g-prompt.sm { font-size: 15px; line-height: 1.6; font-weight: 700; color: #dbe0ec; }
  .g-prompt .blank { color: var(--purple); letter-spacing: 1px; }
  .g-prompt b.st { color:#fff; background: rgba(245,185,66,.15); border-radius:4px; padding:0 3px; }
  .g-listen {
    width: 84px; height: 84px; border-radius: 999px; margin: 6px auto 0; display: flex;
    align-items: center; justify-content: center; font-size: 32px; cursor: pointer;
    background: rgba(199,146,234,.14); border: 1px solid rgba(199,146,234,.4); color: var(--purple);
  }
  .g-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .g-opt {
    text-align: left; background: var(--card2); border: 1px solid var(--line); color: var(--text);
    border-radius: 13px; padding: 14px 15px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; line-height: 1.45; transition: all .18s;
  }
  .g-opt.right { background: rgba(62,207,142,.16); border-color: var(--green); color: var(--green); }
  .g-opt.wrong { background: rgba(255,92,92,.14); border-color: var(--accent); color: var(--accent); }
  .g-opt:disabled { cursor: default; }

  .g-slot {
    min-height: 58px; border: 1px dashed var(--line); border-radius: 13px;
    padding: 9px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start;
  }
  .g-pool { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tok {
    background: var(--card2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .tok.used { opacity: .25; pointer-events: none; }
  .tok.in { background: rgba(199,146,234,.14); border-color: rgba(199,146,234,.4); }
  .g-slot.right { border-color: var(--green); border-style: solid; }
  .g-slot.wrong { border-color: var(--accent); border-style: solid; }

  .g-feed { margin-top: 16px; }
  .g-feed .verdict { font-size: 15px; font-weight: 800; }
  .g-feed .verdict.ok { color: var(--green); }
  .g-feed .verdict.no { color: var(--accent); }
  .g-feed .ans { font-size: 14px; font-weight: 700; color: #fff; margin-top: 8px; line-height: 1.45; }
  .g-feed .sub { font-size: 12.5px; color: var(--sub); margin-top: 5px; line-height: 1.5; }
  .g-next {
    width: 100%; margin-top: 16px; padding: 14px; border-radius: 13px; border: none;
    background: var(--accent); color: #fff; font-size: 14.5px; font-weight: 800;
    cursor: pointer; font-family: inherit;
  }
  .g-score { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  .g-score small { font-size: 18px; color: var(--sub); font-weight: 700; }

  /* ───── library tools ───── */
  .bank-tools { display: flex; gap: 8px; margin-bottom: 10px; }
  .bank-tools input {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; color: var(--text);
    font-size: 14px; font-family: inherit; outline: none;
  }
  .bank-tools input::placeholder { color: var(--dim); }
  .add-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    width: 46px; font-size: 22px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button {
    flex-shrink: 0; background: var(--card); border: 1px solid var(--line); color: var(--sub);
    border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 700;

// ═══════════════ STATE ═══════════════
let today = manilaDate();
let dayData = {};
let expressions = [];
let calCursor = null;
let bankShown = 30;
let newShown = 12;
let bankFilter = "all";

// ═══════════════ HELPERS ═══════════════
function manilaDate(offsetDays = 0) {
  const d = new Date(Date.now() + offsetDays * 86400000);
  return d.toLocaleDateString("en-CA", { timeZone: "Asia/Manila" });
}
function manilaNow() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Manila" }));
}
// 날짜 계산은 전부 UTC 기준으로 한다. 로컬 파싱 + toISOString 조합은
// UTC+8(마닐라)에서 하루씩 밀린다 — 예전 버전에서 복습 예정일이 하루 어긋나던 원인.
function isoToUTC(iso) {
  const [y, m, d] = String(iso).split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function addDays(iso, n) {
  const d = isoToUTC(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function daysBetween(a, b) {
  return Math.round((isoToUTC(b) - isoToUTC(a)) / 86400000);
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
function dayOfYear(iso) {
  const d = new Date(iso + "T00:00:00");
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function relDate(iso) {
  if (!iso) return "";
  if (iso === today) return "오늘";
  if (iso === addDays(today, -1)) return "어제";
  const n = daysBetween(iso, today);
  if (n > 1 && n < 8) return `${n}일 전`;
  return iso.slice(5).replace("-", "/");
}

// ═══════════════ 표현 파싱 — context 필드는 소스마다 의미가 다르다 ═══════════════
// hermes-delivered : context = 예문 (리듬 마크업이 섞여 있을 수 있음)
// hermes-wanted    : context = "<상황 태그>; reusable chunks: a, b, c."
const CHUNK_RE = /reusable chunks?\s*:/i;
function parseContext(e) {
  const out = { example: "", tags: [], chunks: [] };
  const ctx = (e.context || "").trim();
  if (!ctx) return out;
  if (CHUNK_RE.test(ctx)) {
    const idx = ctx.search(CHUNK_RE);
    const head = ctx.slice(0, idx).replace(/[;,\s]+$/, "");
    const tail = ctx.slice(idx).replace(CHUNK_RE, "").replace(/\.\s*$/, "");
    out.tags = head.split(/[\/;]/).map(s => s.trim()).filter(Boolean);
    const sep = tail.includes(";") ? ";" : ",";
    out.chunks = tail.split(sep).map(s => s.trim().replace(/\.$/, "")).filter(Boolean);
  } else {
    out.example = ctx;
  }
  return out;
}
// 리듬 마크업 렌더 — **강세**, → ↘ ↓ ↗ 억양, " / " 끊어읽기
function hasRhythm(s) { return /\*\*|[→↘↓↗]/.test(s || ""); }
function rhythmHtml(s) {
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b class="st">$1</b>');
  // 봇이 "→ / " 로도 "→/" 로도 보낸다. 화살표에 붙은 슬래시는 끊어 읽기 표시다.
  h = h.replace(/([→↘↓↗])\s*\/\s*/g, '<i class="ar">$1</i><i class="br">|</i>');
  h = h.replace(/\s\/\s/g, '<i class="br">|</i>');
  h = h.replace(/([→↘↓↗])/g, '<i class="ar">$1</i>');
  return h;
}
function plain(s) {
  return String(s || "")
    .replace(/\*\*/g, "")
    .replace(/[→↘↓↗]/g, " ")
    .replace(/\s+\/\s+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function isStudied(e) { return e.studied === true || (e.stage || 0) > 0; }
function isGraduated(e) { return (e.stage || 0) >= INTERVALS.length; }
function srcOf(e) {
  if (e.source === "hermes-wanted") return { cls: "wanted", label: "막힌 표현" };
  if (e.source === "hermes-delivered") return { cls: "delivered", label: "봇 배달" };
  return { cls: "manual", label: "직접 추가" };
}
function slotLabel(s) {
  return { AM: "아침", "10AM": "10시 단어", PM: "저녁" }[s] || s || "";
}
// 한→영 앞면에 띄울 프롬프트. 한글 뜻이 없는 「막힌 표현」은 상황 태그로 대체한다.
function promptFor(e, p) {
  if (e.ko) return { ok: true, label: "이 말을 영어로", text: e.ko, tag: false };
  if (e.meaning) return { ok: true, label: "이 뜻을 영어로", text: e.meaning, tag: false };
  if (p.tags.length) return { ok: true, label: "이 상황을 영어로", text: p.tags.join(" · "), tag: true };
  return { ok: false };
}
function wordCount(s) {
  const w = String(s || "").trim().split(/\s+/).filter(Boolean);
  return w.length;
}
// 계단식 힌트. 첫 글자 골격 같은 퍼즐 대신 실제 영어 조각을 조금씩 준다.
// 짧은 표현은 1단계로 끝나고, 긴 문장만 앞부분까지 열린다.
function hintLevels(expr, chunks) {
  const text = String(expr || "").trim();
  const w = text.split(/\s+/).filter(Boolean);
  if (!w.length) return [];
  if (w.length <= 4) {
    return [{ label: "시작", text: w[0] + (w.length > 1 ? " …" : "") }];
  }
  const r = keyRange(text, chunks);           // 밑줄과 같은 표현을 힌트로 준다
  const chunk = r ? text.slice(r[0], r[1]) : "";
  const half = Math.max(3, Math.ceil(w.length * 0.5));
  return [
    { label: chunk ? "핵심 표현" : "시작", text: chunk || (w.slice(0, 2).join(" ") + " …") },
    { label: "앞부분", text: w.slice(0, half).join(" ") + " …" },
  ];
}
// 긴 문장에서 핵심 표현 하나만 찾는다. 통문장을 그대로 맞출 필요는 없다는 표시.
// 여러 개를 밑줄 치면 문장 전체가 덮여 의미가 없어진다 — 딱 하나만 고른다.
// 봇이 내려주는 chunks는 대체로 문장 순서대로라, 먼저 나오는 것이 중심 표현이다.
function keyRange(expr, chunks) {
  const text = String(expr || "");
  const words = text.trim().split(/\s+/).filter(Boolean);
  if (words.length < 5 || !chunks || !chunks.length) return null;  // 짧으면 전체가 타깃
  const lower = text.toLowerCase();
  for (const raw of chunks) {
    const c = String(raw).replace(/\s*~\s*$/, "").trim();
    const cw = c.split(/\s+/).filter(Boolean).length;
    if (cw < 2) continue;
    if (cw > words.length - 2) continue;  // 문장을 거의 다 덮으면 밑줄이 무의미
    const i = lower.indexOf(c.toLowerCase());
    if (i < 0) continue;
    return [i, i + c.length];
  }
  return null;
}
function underlineKey(expr, chunks) {
  const text = String(expr || "");
  const r = keyRange(text, chunks);
  if (!r) return esc(text);
  return esc(text.slice(0, r[0])) + '<u class="key">' + esc(text.slice(r[0], r[1])) + "</u>"
    + esc(text.slice(r[1]));
}

// ═══════════════ TTS ═══════════════
let voices = [];
function loadVoices() {
  try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
  if (document.getElementById("voiceSel")) paintVoices();
}
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

// macOS/iOS의 장난 음성들. 목록에서 아예 뺀다.
const NOVELTY_VOICE = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Eddy|Flo|Fred|Good News|Grandma|Grandpa|Hysterical|Jester|Junior|Kathy|Organ|Pipe Organ|Princess|Ralph|Reed|Rocko|Sandy|Shelley|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/i;

// macOS/iOS 언어가 한국어면 음성 이름도 한글로 온다 — "Ava(프리미엄)", "Zoe(고급)".
// 영어 단어만 찾으면 프리미엄 음성을 못 알아본다. 실제로 그 버그가 있었다.
const PREMIUM_RE = /premium|프리미엄/i;
const ENHANCED_RE = /enhanced|고급/i;
const GOOD_VOICE_RE = /premium|프리미엄|enhanced|고급|natural/i;

// Samantha·Alex 같은 구형 compact 음성은 기계음이 난다.
// Apple Premium/Enhanced, Google, Microsoft Natural 계열을 우선한다.
function voiceScore(v) {
  const n = v.name;
  let s = 0;
  if (PREMIUM_RE.test(n)) s += 100;
  else if (ENHANCED_RE.test(n)) s += 70;
  if (/natural/i.test(n)) s += 60;
  if (/Google US English/i.test(n)) s += 45;
  else if (/^Google/i.test(n)) s += 25;
  if (/\b(Ava|Zoe|Evan|Nathan|Joelle|Noelle|Serena|Allison|Susan|Tom|Nicky|Aaron)\b/i.test(n)) s += 30;
  if (/en[-_]US/i.test(v.lang)) s += 15;
  else if (/en[-_]GB/i.test(v.lang)) s += 6;
  return s;
}
// iPadOS는 자신을 MacIntel로 보고하므로 터치 포인트로 걸러낸다.
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function enVoices() {
  const all = voices.filter(v => /^en[-_]/i.test(v.lang) && !NOVELTY_VOICE.test(v.name));
  // Daniel(영국)·Karen(호주)·Moira(아일랜드)·Rishi(인도)·Tessa(남아공) 같은
  // 비영미권 억양의 구형 compact 음성은 전부 기계음이라 목록에서 뺀다.
  // 남기는 것: 프리미엄/고급/Natural, Google 계열, 그리고 미국 영어.
  const usable = all.filter(v =>
    GOOD_VOICE_RE.test(v.name) || /^Google/i.test(v.name) || /en[-_]US/i.test(v.lang));
  return (usable.length ? usable : all).sort((a, b) => voiceScore(b) - voiceScore(a));
}
function pickVoice() {
  const list = enVoices();
  if (!list.length) return null;
  const saved = localStorage.getItem("et_voice");
  if (saved) {
    const f = list.find(v => v.voiceURI === saved);
    if (f) return f;
  }
  return list[0];
}
function speak(text, btn) {
  const t = plain(text);
  if (!t) return;
  if (!("speechSynthesis" in window)) { toast("이 브라우저는 음성 재생을 지원하지 않습니다"); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US";
    u.rate = speakRate;
    const v = pickVoice();
    if (v) u.voice = v;
    if (btn) {
      btn.classList.add("on");
      u.onend = u.onerror = () => btn.classList.remove("on");
    }
    speechSynthesis.speak(u);
  } catch (e) { toast("음성 재생 실패"); }
}

// ═══════════════ SOUND & HAPTIC ═══════════════
let audioCtx = null;
function crackSound() {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const len = audioCtx.sampleRate * 0.18;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = "highpass"; filt.frequency.value = 1800;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.35;
    src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
    src.start();
  } catch (e) { /* audio unavailable — ignore */ }
}
function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

// ═══════════════ FX ═══════════════
const fx = document.getElementById("fx");
const fctx = fx.getContext("2d");
let particles = [];
let fxRunning = false;
function sizeFx() {
  fx.width = innerWidth * devicePixelRatio;
  fx.height = innerHeight * devicePixelRatio;
  fctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
sizeFx();
addEventListener("resize", sizeFx);
function shatter(el) {
  const r = el.getBoundingClientRect();
  const colors = ["#ff5c5c", "#f5b942", "#3ecf8e", "#5aa9ff", "#e8eaf0"];
  for (let i = 0; i < 34; i++) {
    const px = r.left + Math.random() * r.width;
    const py = r.top + Math.random() * r.height;
    particles.push({
      x: px, y: py,
      vx: (px - (r.left + r.width / 2)) * 0.09 + (Math.random() - 0.5) * 5,
      vy: (py - (r.top + r.height / 2)) * 0.09 - Math.random() * 7 - 2,
      size: 3 + Math.random() * 9, rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.35, color: colors[i % colors.length],
      life: 1, decay: 0.014 + Math.random() * 0.012, tri: Math.random() > 0.4,
    });
  }
  runFx();
}
function confetti() {
  const colors = ["#ff5c5c", "#f5b942", "#3ecf8e", "#5aa9ff", "#c792ea", "#fff"];
  for (let i = 0; i < 140; i++) {
    particles.push({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.4,
      vx: (Math.random() - 0.5) * 3, vy: 2.5 + Math.random() * 4,
      size: 4 + Math.random() * 7, rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3, color: colors[i % colors.length],
      life: 1, decay: 0.004 + Math.random() * 0.005, tri: Math.random() > 0.5,
    });
  }
  runFx();
}
function runFx() {
  if (fxRunning) return;
  fxRunning = true;
  (function frame() {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter(p => p.life > 0);
    if (!particles.length) { fxRunning = false; return; }
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.rot += p.vr; p.life -= p.decay;
      fctx.save();
      fctx.globalAlpha = Math.max(0, p.life);
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.fillStyle = p.color;
      if (p.tri) {
        fctx.beginPath();
        fctx.moveTo(0, -p.size / 2); fctx.lineTo(p.size / 2, p.size / 2); fctx.lineTo(-p.size / 2, p.size / 2);
        fctx.closePath(); fctx.fill();
      } else {
        fctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      }
      fctx.restore();
    }
    requestAnimationFrame(frame);
  })();
}

async function loadDays() {

  snap.forEach(doc => { dayData[doc.id] = doc.data(); });
}
async function loadExpressions() {
  const snap = await db.collection(COL_EXPR).orderBy("learnedDate", "desc").limit(500).get();
  expressions = [];
  snap.forEach(doc => expressions.push({ id: doc.id, ...doc.data() }));

async function saveDay(date) {
  const d = dayData[date] || { tasks: {} };
  d.completedCount = ROUTINES.filter(r => d.tasks[r.k]).length;
  d.total = ROUTINES.length;
  await db.collection(COL_DAYS).doc(date).set({
    ...d, updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true });
}

// ═══════════════ RENDER: HEADER & QUOTE ═══════════════
function renderHeader() {
  const now = manilaNow();
  const dows = ["일", "월", "화", "수", "목", "금", "토"];
  document.getElementById("hDate").textContent =
    `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${dows[now.getDay()]}) · Manila`;
  document.getElementById("todayLabel").textContent = today;
  document.getElementById("qEn").textContent = QUOTES[dayOfYear(today) % QUOTES.length];
}

// ═══════════════ RENDER: ROUTINES ═══════════════
function todayTasks() { return (dayData[today] && dayData[today].tasks) || {}; }

function renderRoutines() {
  const box = document.getElementById("routines");
  const tasks = todayTasks();
  box.innerHTML = "";
  for (const r of ROUTINES) {
    const done = !!tasks[r.k];
    const item = document.createElement("div");
    item.className = "r-item" + (done ? " done" : "");
    item.dataset.k = r.k;
    item.title = r.name;
    item.innerHTML = `<div class="r-dot">${r.icon}</div><div class="r-lb">${esc(r.short)}</div>`;
    item.addEventListener("click", () => toggleRoutine(r.k, item.querySelector(".r-dot")));
    box.appendChild(item);
  }
  updateProgress();
}

async function toggleRoutine(key, card) {
  const d = dayData[today] || (dayData[today] = { tasks: {} });
  d.tasks = d.tasks || {};
  const wasDone = !!d.tasks[key];

  if (wasDone) {
    if (!confirm("완료를 취소할까요?")) return;
    d.tasks[key] = false;
    renderRoutines(); renderCalendar(); renderStreak();
    await saveDay(today);
    return;
  }

  d.tasks[key] = true;
  shatter(card);
  crackSound();
  haptic(60);
  card.parentElement.classList.add("done");
  setTimeout(() => { renderRoutines(); renderCalendar(); renderStreak(); }, 350);

  if (ROUTINES.filter(r => d.tasks[r.k]).length === ROUTINES.length) {
    setTimeout(() => {
      confetti();
      haptic([80, 60, 120]);
      document.getElementById("allDone").classList.add("show");
    }, 500);
  }
  await saveDay(today);
}

function updateProgress() {
  const tasks = todayTasks();
  const n = ROUTINES.filter(r => tasks[r.k]).length;
  document.getElementById("pFill").style.width = (n / ROUTINES.length * 100) + "%";
  document.getElementById("pNum").textContent = `${n}/${ROUTINES.length}`;
  document.getElementById("allDone").classList.toggle("show", n === ROUTINES.length);
}

// ═══════════════ RENDER: STREAK ═══════════════
function dayStatus(iso) {
  const d = dayData[iso];
  if (!d || !d.tasks) return 0;
  const n = ROUTINES.filter(r => d.tasks[r.k]).length;
  if (n >= ROUTINES.length) return 2;
  if (n >= 1) return 1;
  return 0;
}
function renderStreak() {
  let streak = 0;
  let cursor = dayStatus(today) >= 1 ? today : addDays(today, -1);
  while (dayStatus(cursor) >= 1) { streak++; cursor = addDays(cursor, -1); }
  document.getElementById("streakN").textContent = streak;
}

// ═══════════════ RENDER: CALENDAR ═══════════════
function renderCalendar() {
  if (!calCursor) { const n = manilaNow(); calCursor = new Date(n.getFullYear(), n.getMonth(), 1); }
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  document.getElementById("calTitle").textContent = `${y}년 ${m + 1}월`;
  const grid = document.getElementById("calGrid");
  grid.innerHTML = ["일", "월", "화", "수", "목", "금", "토"]
    .map(d => `<div class="cal-dow">${d}</div>`).join("");

  const startDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  let full = 0, part = 0;

  for (let i = 0; i < startDow; i++) grid.insertAdjacentHTML("beforeend", `<div class="cal-cell other"></div>`);
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${y}-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const st = dayStatus(iso);
    if (st === 2) full++; else if (st === 1) part++;
    let mark = "";
    if (st > 0) {
      // 정원. 완주는 실선, 부분 완료는 균일한 점선.
      const color = st === 2 ? "#ff5c5c" : "#f5b942";
      const dash = st === 2 ? "" : ` stroke-dasharray="3.6 4.4"`;
      mark = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="39" fill="none"
        stroke="${color}" stroke-width="${st === 2 ? 5 : 4}" stroke-linecap="round"${dash}
        opacity="${st === 2 ? 0.95 : 0.8}"/></svg>`;
    }
    grid.insertAdjacentHTML("beforeend",
      `<div class="cal-cell${iso === today ? " today" : ""}"><span class="d">${day}</span>${mark}</div>`);
  }
  document.getElementById("stFull").textContent = full;
  document.getElementById("stPart").textContent = part;
  const now = manilaNow();
  const elapsed = (y === now.getFullYear() && m === now.getMonth()) ? now.getDate() : daysInMonth;
  document.getElementById("stRate").textContent = Math.round((full + part * 0.5) / elapsed * 100) + "%";

  document.getElementById("stTotal").textContent = expressions.length;
  document.getElementById("stStudied").textContent = expressions.filter(isStudied).length;
  document.getElementById("stGrad").textContent = expressions.filter(isGraduated).length;
}
document.getElementById("calPrev").onclick = () => { calCursor.setMonth(calCursor.getMonth() - 1); renderCalendar(); };
document.getElementById("calNext").onclick = () => { calCursor.setMonth(calCursor.getMonth() + 1); renderCalendar(); };

// ═══════════════ 표현 카드 — 모든 화면이 같은 규격을 쓴다 ═══════════════
// 뒷면 블록 순서 고정: 뜻 → 예문(리듬) → 이럴 때 → 덩어리 → 내 문장 → 진도 → 액션
// 데이터가 없는 블록만 빠지고, 순서와 라벨은 절대 바뀌지 않는다.
function exprCard(e, mode, dir) {
  const p = parseContext(e);
  const src = srcOf(e);
  const stage = e.stage || 0;
  const card = document.createElement("div");
  card.className = "fc";
  card.dataset.id = e.id;

  // 한→영은 프롬프트로 쓸 한글(또는 상황)이 있을 때만. 없으면 영→한으로 내려간다.
  const pr = promptFor(e, p);
  const recall = dir === "ko2en" && pr.ok;

  const slot = slotLabel(e.slot);
  let html = `
    <div class="fc-top">
      <span class="badge ${src.cls}">${src.label}</span>
      ${slot ? `<span class="badge slot">${esc(slot)}</span>` : ""}
      <span class="badge date">${esc(relDate(e.learnedDate))}</span>
    </div>`;

  if (recall) {
    html += `
      <div class="prompt-l">${esc(pr.label)}<span class="wc">${wordCount(e.expression)}단어</span></div>
      <div class="expr ko${pr.tag ? " tagmode" : ""}">${esc(pr.text)}</div>
      <div class="hintrow"><button class="hint-btn">힌트</button><span class="hint-txt"></span></div>
      <div class="tap-hint">입으로 먼저 말해보고 → 탭해서 정답 비교</div>
      <div class="back">
        <div class="blk blk-answer"><div class="blk-l">정답</div>
          <div class="expr-row">
            <div class="expr">${underlineKey(e.expression, p.chunks)}</div>
            <button class="spk" data-say="${esc(e.expression)}" title="듣기">🔊</button>
          </div>
          ${keyRange(e.expression, p.chunks) ? `<div class="legend">밑줄이 핵심입니다. 이것만 그대로 나왔으면 「알아」 — 나머지 어순은 달라도 됩니다.</div>` : ""}
        </div>`;
  } else {
    html += `
      <div class="expr-row">
        <div class="expr">${underlineKey(e.expression, p.chunks)}</div>
        <button class="spk" data-say="${esc(e.expression)}" title="듣기">🔊</button>
      </div>
      <div class="tap-hint">${mode === "review" || mode === "practice"
        ? "탭해서 뜻 확인 → 소리 내어 3번 말하기"
        : "탭해서 자세히 보기"}</div>
      <div class="back">`;
  }

  // 1. 뜻 (한→영이면 이미 앞면에 썼으므로 생략)
  if (e.meaning && !(recall && !pr.tag)) {
    html += `<div class="blk"><div class="blk-l">뜻</div>
      <div class="blk-mean">${esc(e.meaning)}</div></div>`;
  }
  // 2. 예문 (리듬 마크업 렌더)
  if (p.example) {
    const rhythm = hasRhythm(p.example);
    html += `<div class="blk"><div class="blk-l">예문${rhythm ? " · 리듬" : ""}</div>
      <div class="blk-ex"><span>${rhythmHtml(p.example)}</span>
      <button class="spk sm" data-say="${esc(p.example)}" title="듣기">🔊</button></div>
      ${rhythm ? `<div class="legend">굵게 = 강세 · <i style="font-style:normal;color:#394054">|</i> = 끊어 읽기 · → 유지 · ↘↓ 내려서 · ↗ 올려서</div>` : ""}
      </div>`;
  }
  // 3. 이럴 때 (한→영에서 상황을 프롬프트로 썼으면 생략)
  if (p.tags.length && !(recall && pr.tag)) {
    html += `<div class="blk"><div class="blk-l">이럴 때</div>
      <div class="chips">${p.tags.map(t => `<span class="chip tag">${esc(t)}</span>`).join("")}</div></div>`;
  }
  // 4. 덩어리 (통째로 외울 조각 — 탭하면 들린다)
  if (p.chunks.length) {
    html += `<div class="blk"><div class="blk-l">덩어리로 외우기</div>
      <div class="chips">${p.chunks.map(c =>
        `<span class="chip" data-say="${esc(c)}">${esc(c)}</span>`).join("")}</div></div>`;
  }
  // 5. 진도
  const dots = INTERVALS.map((_, i) => `<i class="${i < stage ? "on" : ""}"></i>`).join("");
  let nextTxt;
  if (!isStudied(e)) nextTxt = "아직 복습 시작 전";
  else if (isGraduated(e)) nextTxt = "졸업 🏆";
  else {
    const d = daysBetween(today, e.nextReview || today);
    nextTxt = d <= 0 ? "오늘 복습" : `${d}일 뒤 (${e.nextReview})`;
  }
  html += `<div class="blk"><div class="blk-l">진도</div>
    <div class="prog-row"><div class="stage-dots">${dots}</div>
    <div class="prog-next">${esc(nextTxt)}</div></div></div>`;

  // 6. 액션
  if (mode === "review") {
    html += `<div class="fc-btns">
      <button class="btn-again">몰라<small>1단계로</small></button>
      <button class="btn-hard">애매<small>내일 다시</small></button>
      <button class="btn-good">알아<small>다음 단계</small></button>
    </div>`;
  } else if (mode === "new") {
    html += `<button class="btn-study">✓ 학습 완료 — 복습 주기에 넣기</button>`;
  } else if (mode === "practice") {
    /* 연습 모드는 액션 없음 — 기록을 건드리지 않는다 */
  } else if (isGraduated(e)) {
    html += `<button class="btn-reopen">↺ 복습 큐에 다시 넣기</button>`;
  }

  html += `</div>`;
  card.innerHTML = html;

  // ── events ──
  card.addEventListener("click", ev => {
    if (ev.target.closest("button") || ev.target.closest("[data-say]") ||
        ev.target.closest("input")) return;
    card.classList.toggle("open");
  });
  card.querySelectorAll("[data-say]").forEach(el => {
    el.addEventListener("click", ev => { ev.stopPropagation(); speak(el.dataset.say, el); });
  });
  const hintBtn = card.querySelector(".hint-btn");
  if (hintBtn) {
    const levels = hintLevels(e.expression, p.chunks);
    let lv = 0;
    hintBtn.addEventListener("click", ev => {
      ev.stopPropagation();
      if (lv >= levels.length) return;
      const txt = card.querySelector(".hint-txt");
      txt.innerHTML = `<em>${esc(levels[lv].label)}</em> ${esc(levels[lv].text)}`;
      lv++;
      if (lv >= levels.length) hintBtn.style.display = "none";
      else hintBtn.textContent = "힌트 더";
    });
  }
  const btnStudy = card.querySelector(".btn-study");
  if (btnStudy) btnStudy.addEventListener("click", ev => { ev.stopPropagation(); markStudied(e, card); });
  const btnReopen = card.querySelector(".btn-reopen");
  if (btnReopen) btnReopen.addEventListener("click", async ev => {
    ev.stopPropagation();
    e.stage = 0; e.nextReview = addDays(today, 1);
    await saveExpr(e.id, { stage: 0, nextReview: e.nextReview });
    toast("내일부터 다시 복습합니다");
    rerenderActive();
  });
  ["again", "hard", "good"].forEach(k => {
    const b = card.querySelector(".btn-" + k);
    if (b) b.addEventListener("click", ev => { ev.stopPropagation(); grade(e, k, card); });
  });
  return card;
}

function fadeOut(card, after) {
  card.style.opacity = "0";
  card.style.transform = "translateX(40px)";
  setTimeout(after, 280);
}

// ═══════════════ 배울 표현 (아직 학습 체크 안 한 것) ═══════════════
function newItems() {
  return expressions
    .filter(e => !isStudied(e))
    .sort((a, b) => (a.learnedDate || "") < (b.learnedDate || "") ? 1 : -1);
}
async function markStudied(e, card) {
  e.studied = true;
  e.studiedAt = today;
  e.stage = 0;
  e.nextReview = addDays(today, INTERVALS[0]);
  crackSound(); haptic(40);
  if (card) fadeOut(card, () => { renderNew(); renderDue(); renderDist(); updateDots(); });
  else { renderNew(); renderDue(); renderDist(); updateDots(); }
  toast("내일 첫 복습에서 만납니다");
  await saveExpr(e.id, { studied: true, studiedAt: today, stage: 0, nextReview: e.nextReview });
}
function renderNew() {
  const items = newItems();
  const box = document.getElementById("newList");
  if (!items.length) {
    box.innerHTML = `<div class="empty"><b>배울 표현을 전부 처리했습니다.</b><br>봇이 새로 보내면 여기에 나타납니다.</div>`;
    document.getElementById("clearOld").style.display = "none";
    return;
  }
  document.getElementById("clearOld").style.display =
    items.some(e => (e.learnedDate || "") < today) ? "" : "none";
  box.innerHTML = "";
  let lastDate = null;
  for (const e of items.slice(0, newShown)) {
    if (e.learnedDate !== lastDate) {
      lastDate = e.learnedDate;
      const c = items.filter(x => x.learnedDate === lastDate).length;
      box.insertAdjacentHTML("beforeend",
        `<div class="date-sep">${esc(relDate(lastDate))} · ${c}개</div>`);
    }
    box.appendChild(exprCard(e, "new", "en2ko"));
  }
  if (items.length > newShown) {
    const b = document.createElement("button");
    b.className = "more-btn";
    b.textContent = `더 보기 (${items.length - newShown}개 남음)`;
    b.onclick = () => { newShown += 12; renderNew(); };
    box.appendChild(b);
  }
}
// 밀린 표현 일괄 처리. 전부 내일로 몰면 하루에 수십 개를 복습해야 하므로
// BACKLOG_SPREAD 일에 나눠 배치한다 (오래된 것부터 먼저).
const BACKLOG_SPREAD = 5;
document.getElementById("clearOld").addEventListener("click", async () => {
  const old = newItems().filter(e => (e.learnedDate || "") < today)
    .sort((a, b) => (a.learnedDate || "") < (b.learnedDate || "") ? -1 : 1);
  if (!old.length) return;
  const perDay = Math.ceil(old.length / BACKLOG_SPREAD);
  if (!confirm(
    `지난 표현 ${old.length}개를 복습 대기로 넘길까요?\n\n` +
    `카드를 하나씩 보지 않고 바로 복습 주기에 태우는 방식입니다.\n` +
    `한 번에 몰리지 않게 ${BACKLOG_SPREAD}일에 나눠 배치됩니다 (하루 약 ${perDay}개).\n\n` +
    `하나씩 보면서 공부하려면 취소하고 카드마다 「학습 완료」를 누르세요.`)) return;
  const batch = db.batch();
  old.forEach((e, i) => {
    const nr = addDays(today, 1 + (i % BACKLOG_SPREAD));
    e.studied = true; e.studiedAt = today; e.stage = 0; e.nextReview = nr;
    batch.set(db.collection(COL_EXPR).doc(e.id),
      { studied: true, studiedAt: today, stage: 0, nextReview: nr }, { merge: true });
  });
  newShown = 12;
  renderNew(); renderDue(); renderDist(); updateDots();
  try { await batch.commit(); toast(`${old.length}개를 ${BACKLOG_SPREAD}일에 나눠 배치했습니다`); }
  catch (err) { console.error(err); toast("저장 실패 — 새로고침 해주세요"); }
});

// ═══════════════ 복습 큐 ═══════════════
function dueItems() {

    .filter(e => isStudied(e) && !isGraduated(e) && e.nextReview && e.nextReview <= today)
    .sort((a, b) => (a.nextReview < b.nextReview ? -1 : 1));
}
function renderDue() {

      (n ? `「오늘」 탭에 배울 표현 ${n}개가 기다립니다.` : `깨끗하게 끝!`) + `</div>
      <button class="more-btn" id="practiceBtn" style="margin-top:10px">

// 복습 큐가 비었을 때의 자유 연습. 카드만 넘겨보고 복습 일정은 건드리지 않는다.

  const box = document.getElementById("dueList");
  box.innerHTML = `<div class="empty" style="margin-bottom:10px">
    연습 모드 — 단계·복습일은 바뀌지 않습니다.</div>`;
  items.forEach(e => box.appendChild(exprCard(e, "practice", revDir)));
  const back = document.createElement("button");
  back.className = "more-btn";
  back.textContent = "연습 끝내기";
  back.onclick = renderDue;
  box.appendChild(back);
  toast(revDir === "ko2en" ? "한→영 연습 시작" : "영→한 연습 시작");
}

async function grade(e, kind, card) {
  let stage = e.stage || 0;
  let next;
  if (kind === "good") {
    stage = Math.min(stage + 1, INTERVALS.length);
    next = stage >= INTERVALS.length ? GRADUATED : addDays(today, INTERVALS[stage]);
  } else if (kind === "hard") {
    next = addDays(today, 1);
  } else {
    stage = 0;
    next = addDays(today, 1);
  }
  e.stage = stage; e.nextReview = next;
  haptic(kind === "good" ? 40 : 25);
  fadeOut(card, () => { renderDue(); renderDist(); updateDots(); });
  if (kind === "good" && stage >= INTERVALS.length) toast("🏆 완전 습득! 이 표현은 졸업했습니다");
  else if (kind === "good") toast(`${INTERVALS[stage]}일 뒤 다시 (${next})`);
  else if (kind === "hard") toast("단계 유지 · 내일 다시");
  else toast("1단계로 리셋 · 내일 처음부터");
  await saveExpr(e.id, { stage, nextReview: next });
}

// ═══════════════ 단계별 현황 ═══════════════
function renderDist() {
  const rows = [
    ["미학습", expressions.filter(e => !isStudied(e)).length],
    ["1단계", expressions.filter(e => isStudied(e) && (e.stage || 0) === 0).length],
    ["2단계", expressions.filter(e => (e.stage || 0) === 1).length],
    ["3단계", expressions.filter(e => (e.stage || 0) === 2).length],
    ["4단계", expressions.filter(e => (e.stage || 0) === 3).length],

  ];

  document.getElementById("dist").innerHTML = rows.map(([lb, n]) => `
    <div class="dist-row">
      <div class="lb">${lb}</div>

      <div class="vn">${n}</div>

}

// ═══════════════ 게임 ═══════════════
// 출제는 「쌓인 것 + 잘 못 외우는 것」에 가중치를 준다.
// 게임 정답은 복습 일정을 앞당기지 않는다 — 게임으로 SRS를 우회하면 간격이 망가진다.
// 대신 틀리면 wrong 카운트를 올리고 내일 복습으로 당겨온다.
const GAME_LEN = 10;
let game = null;

function weightOf(e) {
  if (isGraduated(e)) return 0.2;
  const wrong = e.wrong || 0;
  const stage = Math.min(e.stage || 0, 5);
  let w = (1 + wrong * 3) * ((6 - stage) / 6 + 0.3);
  if (!isStudied(e)) w *= 2.5;
  return w;
}
function playable(e) {
  const p = parseContext(e);
  return !!(e.meaning || orderTextOf(e, p));
}
function orderTextOf(e, p) {
  const full = String(e.expression || "").trim();
  const wc = wordCount(full);
  if (wc >= 2 && wc <= 8) return full;
  const r = keyRange(full, p.chunks);
  if (r) {
    const t = full.slice(r[0], r[1]);
    if (wordCount(t) >= 2 && wordCount(t) <= 8) return t;
  }
  return null;
}
function shuffle(a) {
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [x[i], x[j]] = [x[j], x[i]];
  }
  return x;
}
function pickWeighted(pool, n) {
  const rest = pool.slice();
  const out = [];
  while (out.length < n && rest.length) {
    const total = rest.reduce((s, e) => s + weightOf(e), 0);
    let r = Math.random() * total;
    let idx = rest.length - 1;
    for (let i = 0; i < rest.length; i++) { r -= weightOf(rest[i]); if (r <= 0) { idx = i; break; } }
    out.push(rest.splice(idx, 1)[0]);
  }
  return out;
}

function buildRound(e, pool) {
  const p = parseContext(e);
  const kinds = [];
  if (e.meaning) kinds.push("meaning", "expr");
  if (e.meaning && "speechSynthesis" in window) kinds.push("listen");
  const ex = plain(p.example);
  const hasCloze = ex && ex.toLowerCase().indexOf(String(e.expression).toLowerCase()) >= 0;
  if (hasCloze) kinds.push("cloze");
  const ord = orderTextOf(e, p);
  if (ord) kinds.push("order", "order");   // 조립은 어순 훈련이라 비중을 두 배로
  if (!kinds.length) return null;
  const kind = kinds[Math.floor(Math.random() * kinds.length)];

  if (kind === "order") {
    return { kind, e, answer: ord, tokens: shuffle(ord.split(/\s+/).filter(Boolean)) };
  }
  // 4지선다 — 오답 보기는 같은 종류의 다른 표현에서 뽑는다.
  // 길이가 비슷한 것으로 좁힌다. 길이만 봐도 답이 보이면 문제가 안 된다.
  const needMeaning = kind === "meaning";
  const textOf = x => needMeaning ? x.meaning : x.expression;
  const target = wordCount(textOf(e));
  const cands = pool.filter(x =>
    x.id !== e.id && textOf(x) && textOf(x) !== textOf(e));
  const near = cands
    .slice()
    .sort((a, b) => Math.abs(wordCount(textOf(a)) - target) - Math.abs(wordCount(textOf(b)) - target))
    .slice(0, Math.max(6, Math.ceil(cands.length * 0.4)));
  const others = shuffle(near).slice(0, 3);
  if (others.length < 3) return null;
  const options = shuffle([e, ...others]).map(x => ({
    id: x.id,
    text: needMeaning ? x.meaning : x.expression,
    ok: x.id === e.id,
  }));
  let prompt = "";
  if (kind === "meaning") prompt = e.expression;
  else if (kind === "expr") prompt = e.meaning;
  else if (kind === "listen") prompt = "";
  else if (kind === "cloze") {
    const i = ex.toLowerCase().indexOf(String(e.expression).toLowerCase());
    prompt = esc(ex.slice(0, i)) + '<span class="blank">______</span>'
      + esc(ex.slice(i + e.expression.length));
  }
  return { kind, e, options, prompt };
}

const KIND_LABEL = {
  meaning: "뜻 고르기", expr: "영어로 고르기", listen: "듣고 고르기",
  cloze: "빈칸 채우기", order: "문장 조립",
};

function gamePool() { return expressions.filter(playable); }

function renderGameStart() {
  const pool = gamePool();
  const best = parseInt(localStorage.getItem("et_best") || "0", 10);
  const weak = expressions.filter(e => (e.wrong || 0) > 0)
    .sort((a, b) => (b.wrong || 0) - (a.wrong || 0)).slice(0, 5);
  const box = document.getElementById("gameBox");
  box.innerHTML = `
    <div class="g-hero">
      <h2>🎮 표현 게임</h2>
      <p>${GAME_LEN}문항. 뜻 고르기 · 영어 고르기 · 듣고 고르기 ·<br>빈칸 채우기 · 문장 조립이 섞여 나옵니다.<br>
      <b style="color:#c3c9d9">아직 안 외운 것</b>과 <b style="color:#c3c9d9">전에 틀린 것</b>이 먼저 나옵니다.</p>
      ${best ? `<div class="best">최고 기록 ${best} / ${GAME_LEN}</div>` : ""}
      <button class="g-go" id="gGo"${pool.length < 4 ? " disabled" : ""}>
        ${pool.length < 4 ? "표현이 더 쌓여야 시작할 수 있습니다" : "시작하기"}</button>
    </div>
    ${weak.length ? `<div class="sec-head"><div class="sec-title">잘 안 외워지는 표현</div>
      <div class="sec-sub">게임에서 틀린 횟수</div></div>
      <div class="g-weak">${weak.map(e => `<div class="row">
        <div class="e">${esc(e.expression)}</div><div class="x">${e.wrong}회</div></div>`).join("")}</div>` : ""}`;
  const go = document.getElementById("gGo");
  if (go && !go.disabled) go.onclick = startGame;
}

function startGame() {
  const pool = gamePool();
  const picks = pickWeighted(pool, Math.min(GAME_LEN, pool.length));
  const rounds = picks.map(e => buildRound(e, pool)).filter(Boolean);
  if (!rounds.length) { toast("출제할 표현이 부족합니다"); return; }
  game = { rounds, i: 0, score: 0, combo: 0, bestCombo: 0, misses: [], results: new Map() };
  renderRound();
}

function gameBarHtml() {
  const pct = (game.i / game.rounds.length * 100).toFixed(1);
  return `<div class="g-bar">
    <div class="tr"><div class="bf" style="width:${pct}%"></div></div>
    <div class="n">${game.i + 1}/${game.rounds.length}</div>
    ${game.combo >= 2 ? `<div class="combo">🔥${game.combo}</div>` : ""}
  </div>`;
}

function renderRound() {
  const r = game.rounds[game.i];
  const box = document.getElementById("gameBox");
  let body = "";
  if (r.kind === "listen") {
    body = `<div class="g-listen" id="gPlay">🔊</div>`;
  } else if (r.kind === "cloze") {
    body = `<div class="g-prompt sm">${r.prompt}</div>`;
  } else {
    body = `<div class="g-prompt${r.kind === "expr" ? " ko" : ""}">${esc(r.prompt || "")}</div>`;
  }

  if (r.kind === "order") {
    body = `<div class="g-prompt${r.e.meaning ? " ko" : " sm"}">${esc(r.e.meaning || parseContext(r.e).tags.join(" · ") || "단어를 순서대로")}</div>
      <div class="g-slot" id="gSlot"></div>
      <div class="g-pool" id="gPool">${r.tokens.map((t, i) =>
        `<button class="tok" data-i="${i}">${esc(t)}</button>`).join("")}</div>`;
  }

  box.innerHTML = `${gameBarHtml()}
    <div class="g-card">
      <div class="g-kind">${KIND_LABEL[r.kind]}</div>
      ${body}
      ${r.options ? `<div class="g-opts">${r.options.map((o, i) =>
        `<button class="g-opt" data-i="${i}">${esc(o.text)}</button>`).join("")}</div>` : ""}
      <div id="gFeed"></div>
    </div>`;

  if (r.kind === "listen") {
    const play = () => speak(r.e.expression, null);
    document.getElementById("gPlay").onclick = play;
    setTimeout(play, 250);
  }
  if (r.options) {
    box.querySelectorAll(".g-opt").forEach(b => {
      b.onclick = () => answerChoice(parseInt(b.dataset.i, 10));
    });
  }
  if (r.kind === "order") setupOrder(r);
}

function setupOrder(r) {
  const slot = document.getElementById("gSlot");
  const pool = document.getElementById("gPool");
  const chosen = [];
  const paint = () => {
    slot.innerHTML = chosen.map((ci, pos) =>
      `<button class="tok in" data-pos="${pos}">${esc(r.tokens[ci])}</button>`).join("");
    pool.querySelectorAll(".tok").forEach(t =>
      t.classList.toggle("used", chosen.indexOf(parseInt(t.dataset.i, 10)) >= 0));
    slot.querySelectorAll(".tok").forEach(t => {
      t.onclick = () => { chosen.splice(parseInt(t.dataset.pos, 10), 1); paint(); };
    });
    if (chosen.length === r.tokens.length) {
      const built = chosen.map(ci => r.tokens[ci]).join(" ");
      const ok = built.toLowerCase() === r.answer.toLowerCase();
      slot.classList.add(ok ? "right" : "wrong");
      pool.querySelectorAll(".tok").forEach(t => t.disabled = true);
      slot.querySelectorAll(".tok").forEach(t => t.onclick = null);
      finishRound(ok);
    }
  };
  pool.querySelectorAll(".tok").forEach(t => {
    t.onclick = () => { chosen.push(parseInt(t.dataset.i, 10)); paint(); };
  });
  paint();
}

function answerChoice(idx) {
  const r = game.rounds[game.i];
  const btns = [...document.querySelectorAll(".g-opt")];
  btns.forEach((b, i) => {
    b.disabled = true;
    if (r.options[i].ok) b.classList.add("right");
    else if (i === idx) b.classList.add("wrong");
  });
  finishRound(r.options[idx].ok);
}

function finishRound(ok) {
  const r = game.rounds[game.i];
  const e = r.e;
  if (ok) {
    game.score++; game.combo++;
    game.bestCombo = Math.max(game.bestCombo, game.combo);
    crackSound(); haptic(30);
  } else {
    game.combo = 0;
    game.misses.push(e);
    haptic([40, 40, 40]);
  }
  // 같은 표현이 두 번 나와도 한 번이라도 틀렸으면 오답으로 남긴다
  if (!ok || !game.results.has(e.id)) game.results.set(e.id, ok);

  const p = parseContext(e);
  const last = game.i === game.rounds.length - 1;
  document.getElementById("gFeed").innerHTML = `
    <div class="g-feed">
      <div class="verdict ${ok ? "ok" : "no"}">${ok ? "정답" : "오답"}</div>
      <div class="ans">${esc(e.expression)}</div>
      <div class="sub">${esc(e.meaning || p.tags.join(" · ") || "")}</div>
      ${p.example ? `<div class="sub">${rhythmHtml(p.example)}</div>` : ""}
      <button class="g-next" id="gNext">${last ? "결과 보기" : "다음 문제"}</button>
    </div>`;
  if (!ok) speak(e.expression, null);
  document.getElementById("gNext").onclick = () => {
    game.i++;
    if (game.i >= game.rounds.length) endGame();
    else renderRound();
  };
}

async function endGame() {
  const total = game.rounds.length;
  const best = parseInt(localStorage.getItem("et_best") || "0", 10);
  const isBest = game.score > best;
  if (isBest) localStorage.setItem("et_best", String(game.score));

  // 기록 반영 — 오답만 스케줄을 당긴다. 정답은 SRS를 건드리지 않는다.
  const batch = db.batch();
  let writes = 0;
  game.results.forEach((ok, id) => {
    const e = expressions.find(x => x.id === id);
    if (!e) return;
    const patch = {};
    if (ok) { e.right = (e.right || 0) + 1; patch.right = e.right; }
    else {
      e.wrong = (e.wrong || 0) + 1; patch.wrong = e.wrong;
      if (isStudied(e) && !isGraduated(e) && (!e.nextReview || e.nextReview > today)) {
        e.nextReview = addDays(today, 1);
        patch.nextReview = e.nextReview;
      }
    }
    batch.set(db.collection(COL_EXPR).doc(id), patch, { merge: true });
    writes++;
  });

  const missed = game.misses;
  document.getElementById("gameBox").innerHTML = `
    <div class="g-hero">
      <div class="g-score">${game.score}<small> / ${total}</small></div>
      <p>최고 콤보 🔥${game.bestCombo}${isBest ? " · <b style=\"color:#f5b942\">신기록</b>" : ""}</p>
      <button class="g-go" id="gAgain">다시 하기</button>
    </div>
    ${missed.length ? `<div class="sec-head"><div class="sec-title">틀린 표현</div>
      <div class="sec-sub">다음 게임에 더 자주 나옵니다</div></div>
      <div class="g-weak">${missed.map(e => `<div class="row">
        <div class="e">${esc(e.expression)}<br>
        <span style="font-size:11.5px;color:var(--sub);font-weight:600">${esc(e.meaning || "")}</span></div>
        </div>`).join("")}</div>`
      : `<div class="empty" style="margin-top:14px"><b>전부 맞혔습니다.</b></div>`}`;
  document.getElementById("gAgain").onclick = startGame;
  game = null;
  renderDue(); renderDist(); updateDots();
  if (writes) {
    try { await batch.commit(); }
    catch (err) { console.error(err); toast("게임 기록 저장 실패"); }
  }
}

// ═══════════════ 표현 전체 (라이브러리) ═══════════════
const FILTERS = [
  { k: "all",       label: "전체" },
  { k: "wanted",    label: "막힌 표현" },
  { k: "delivered", label: "봇 배달" },
  { k: "manual",    label: "직접 추가" },
  { k: "new",       label: "미학습" },
  { k: "grad",      label: "졸업" },
];
function renderFilters() {
  document.getElementById("filters").innerHTML = FILTERS.map(f =>
    `<button data-f="${f.k}" class="${bankFilter === f.k ? "on" : ""}">${f.label}</button>`).join("");
  document.querySelectorAll("#filters button").forEach(b => {
    b.onclick = () => { bankFilter = b.dataset.f; bankShown = 30; renderFilters(); renderBank(); };
  });
}
function renderBank() {
  const q = document.getElementById("bankSearch").value.trim().toLowerCase();
  let items = expressions;
  if (bankFilter === "wanted") items = items.filter(e => e.source === "hermes-wanted");
  else if (bankFilter === "delivered") items = items.filter(e => e.source === "hermes-delivered");
  else if (bankFilter === "manual") items = items.filter(e => e.source === "manual");
  else if (bankFilter === "new") items = items.filter(e => !isStudied(e));
  else if (bankFilter === "grad") items = items.filter(isGraduated);
  if (q) items = items.filter(e =>
    (e.expression || "").toLowerCase().includes(q) ||
    (e.meaning || "").toLowerCase().includes(q) ||
    (e.context || "").toLowerCase().includes(q));

  document.getElementById("bankCount").textContent = `${items.length} / ${expressions.length}개`;
  const box = document.getElementById("bankList");
  box.innerHTML = "";
  if (!items.length) {
    box.innerHTML = `<div class="empty">해당하는 표현이 없습니다.</div>`;
    return;
  }
  items.slice(0, bankShown).forEach(e => box.appendChild(exprCard(e, "browse", "en2ko")));
  if (items.length > bankShown) {
    const b = document.createElement("button");
    b.className = "more-btn";
    b.textContent = `더 보기 (${items.length - bankShown}개 남음)`;
    b.onclick = () => { bankShown += 30; renderBank(); };
    box.appendChild(b);
  }
}
document.getElementById("bankSearch").addEventListener("input", () => { bankShown = 30; renderBank(); });

// ═══════════════ 탭 배지 ═══════════════
function updateDots() {
  const n = newItems().length, d = dueItems().length;
  const dn = document.getElementById("dotNew"), dd = document.getElementById("dotDue");
  dn.textContent = n > 99 ? "99+" : n; dn.classList.toggle("show", n > 0);
  dd.textContent = d > 99 ? "99+" : d; dd.classList.toggle("show", d > 0);
}
function rerenderActive() {
  renderNew(); renderDue(); renderDist(); renderBank(); updateDots();
}

// ═══════════════ 복습 방향 토글 ═══════════════
function paintDir() {
  document.querySelectorAll("#dirSeg button").forEach(b =>
    b.classList.toggle("on", b.dataset.d === revDir));
}
document.querySelectorAll("#dirSeg button").forEach(b => {
  b.addEventListener("click", () => {
    revDir = b.dataset.d;
    localStorage.setItem("et_dir", revDir);
    paintDir();
    renderDue();
    toast(revDir === "ko2en" ? "한→영 · 입으로 꺼내기" : "영→한 · 눈으로 익히기");
  });
});
paintDir();

// ═══════════════ 직접 추가 ═══════════════
const modalBg = document.getElementById("modalBg");
document.getElementById("addBtn").onclick = () => { modalBg.classList.add("show"); document.getElementById("mExpr").focus(); };
document.getElementById("mCancel").onclick = () => modalBg.classList.remove("show");
modalBg.addEventListener("click", e => { if (e.target === modalBg) modalBg.classList.remove("show"); });
document.getElementById("mSave").onclick = async () => {
  const expr = document.getElementById("mExpr").value.trim();
  const mean = document.getElementById("mMean").value.trim();
  const ctx = document.getElementById("mCtx").value.trim();
  if (!expr) { toast("표현을 입력해주세요"); return; }
  const doc = {
    expression: expr, meaning: mean, context: ctx,
    source: "manual", slot: "", learnedDate: today,
    studied: true, studiedAt: today,
    stage: 0, nextReview: addDays(today, INTERVALS[0]),
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  try {
    const ref = await db.collection(COL_EXPR).add(doc);
    expressions.unshift({ id: ref.id, ...doc });
    ["mExpr", "mMean", "mCtx"].forEach(id => document.getElementById(id).value = "");
    modalBg.classList.remove("show");
    toast("저장 완료 — 내일부터 복습에 나옵니다");
    rerenderActive();
  } catch (err) { console.error(err); toast("저장 실패 — 연결을 확인해주세요"); }
};

// ═══════════════ 설정 ═══════════════
const sndBtn = document.getElementById("sndBtn");
function paintSnd() { sndBtn.textContent = soundOn ? "켜짐" : "꺼짐"; sndBtn.classList.toggle("on", soundOn); }
sndBtn.onclick = () => { soundOn = !soundOn; localStorage.setItem("et_sound", soundOn ? "1" : "0"); paintSnd(); };
paintSnd();

const VOICE_SAMPLE = "Let me know a day before if there's a viewing schedule.";
const RATES = [[0.7, "느리게"], [0.9, "보통"], [1.1, "빠르게"]];
const rateBtn = document.getElementById("rateBtn");
function paintRate() {
  const r = RATES.find(x => Math.abs(x[0] - speakRate) < 0.01) || RATES[1];
  rateBtn.textContent = r[1];
}
rateBtn.onclick = () => {
  const i = RATES.findIndex(x => Math.abs(x[0] - speakRate) < 0.01);
  speakRate = RATES[(i + 1) % RATES.length][0];
  localStorage.setItem("et_rate", String(speakRate));
  paintRate();
  speak(VOICE_SAMPLE, rateBtn);
};
paintRate();

function paintVoices() {
  const sel = document.getElementById("voiceSel");
  if (!sel) return;
  const list = enVoices();
  const cur = pickVoice();
  sel.innerHTML = list.length
    ? list.map(v => `<option value="${esc(v.voiceURI)}"${cur && v.voiceURI === cur.voiceURI ? " selected" : ""}>${esc(v.name)}</option>`).join("")
    : `<option>사용 가능한 영어 음성 없음</option>`;
  // 지금 쓰는 음성의 품질 등급을 그대로 보여준다.
  // 기기가 3대(맥·아이폰·아이패드)라 어디서 기계음이 나는지 바로 알 수 있어야 한다.
  const curEl = document.getElementById("voiceCur");
  if (!cur) { curEl.textContent = ""; curEl.className = "voice-cur"; }
  else {
    const good = GOOD_VOICE_RE.test(cur.name) || /^Google/i.test(cur.name);
    const tier = PREMIUM_RE.test(cur.name) ? "프리미엄 — 가장 자연스러움"
      : ENHANCED_RE.test(cur.name) ? "고급 — 자연스러움"
      : good ? "고품질"
      : "기본(compact) — 기계음이 납니다";
    curEl.textContent = `현재: ${cur.name} · ${tier}`;
    curEl.className = "voice-cur " + (good ? "good" : "plain");
  }

  // Premium/Enhanced/Natural 이 하나도 없으면 기계음이 날 수밖에 없다.
  // 단, iOS는 받아도 소용없다 — Safari가 다운로드한 프리미엄 음성을 웹에 노출하지 않는다.
  // 여기서 Mac용 안내를 그대로 띄우면 아이폰에서 헛수고를 시키게 된다.
  const hasGood = list.some(v => GOOD_VOICE_RE.test(v.name) || /^Google/i.test(v.name));
  document.getElementById("voiceNote").innerHTML = hasGood ? "" : (isIOS()
    ? `아이폰·아이패드 Safari는 <b>다운로드한 프리미엄 음성을 웹페이지에 제공하지 않습니다</b>(iOS 제한).
       설정에서 Ava(프리미엄)를 받아도 이 목록에는 나타나지 않습니다 — 기기 자체 읽어주기 기능에서만 쓰입니다.<br>
       여기서는 기본 음성이 최선이라, 발음은 <b>맥북에서 듣는 걸</b> 권합니다.`
    : `이 기기엔 기본(compact) 음성만 있어 기계음이 납니다. <b>Apple 프리미엄 음성</b>을 받으면 크게 달라집니다.<br>
       시스템 설정 → 손쉬운 사용 → 읽어주기 → 시스템 음성 → 음성 관리 → 영어(미국) → <b>Ava(프리미엄)</b><br>
       받은 뒤 이 페이지를 새로고침하면 위 목록에 나타납니다.`);
}
document.getElementById("voiceSel").onchange = ev => {
  localStorage.setItem("et_voice", ev.target.value);
  speak(VOICE_SAMPLE, null);
};
document.getElementById("voiceTest").onclick = ev => speak(VOICE_SAMPLE, ev.currentTarget);
paintVoices();

// ═══════════════ INIT ═══════════════
async function init() {
  renderHeader();
  try {
    await Promise.all([loadDays(), loadExpressions()]);
  } catch (err) {
    toast("데이터 로드 실패 — 새로고침 해주세요");
    console.error(err);
  }
  renderRoutines();
  renderStreak();
  renderCalendar();
  renderFilters();
  renderNew();
  renderDue();
  renderDist();
  renderBank();
  updateDots();
}

// ═══════════════ AUTH ═══════════════
// 화면에 로그인은 없다. 앱이 열릴 때 익명 계정으로 조용히 로그인한다.
auth.onAuthStateChanged(user => { if (user) init(); });
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
  .then(() => auth.signInAnonymously())
  .catch(err => {
    console.error(err);
    toast("연결에 실패했습니다 — 새로고침 해주세요");
  });

// 자정을 넘겨도 켜져 있으면 날짜 갱신
setInterval(() => {
  const t = manilaDate();
  if (t !== today && auth.currentUser) { today = t; newShown = 12; init(); }
}, 60000);
</script>
